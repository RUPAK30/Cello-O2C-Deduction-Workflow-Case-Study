<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Width audit</title>
<style>body{font:13px/1.4 monospace;margin:0;padding:8px}pre{white-space:pre-wrap}</style></head>
<body><pre id="out">running…</pre>
<script>
var WIDTHS = [320,360,390,414,480,600,720,768,820,900,1024,1280,1440,1600];
var PAGES = ['index.html','case-study.html','desk.html','lender.html','sources.html'];

function scrollableAncestor(el, root) {
  var n = el;
  while (n && n !== root) {
    var s = n.ownerDocument.defaultView.getComputedStyle(n);
    if (/(auto|scroll)/.test(s.overflowX) && n.scrollWidth > n.clientWidth + 2) return true;
    n = n.parentElement;
  }
  return false;
}

function measure(url, w) {
  return new Promise(function (resolve) {
    var f = document.createElement('iframe');
    f.style.cssText = 'width:' + w + 'px;height:900px;border:0;position:absolute;left:-99999px;top:0';
    f.src = url + '?audit=' + Math.random();
    f.onload = function () {
      setTimeout(function () {
        try {
          var d = f.contentDocument, win = f.contentWindow, vw = win.innerWidth;
          var off = [];
          var all = d.querySelectorAll('body *');
          for (var i = 0; i < all.length; i++) {
            var el = all[i], b = el.getBoundingClientRect();
            if (b.width > 0 && b.right > vw + 2) {
              if (scrollableAncestor(el, d.body)) continue;
              if (/^(path|svg|circle|text|span|i|b|em|code|small|br|thead|tbody|tr|th|td)$/.test(el.tagName.toLowerCase())) continue;
              off.push(el.tagName.toLowerCase() + '.' + String(el.className || '').slice(0, 26) + '@' + Math.round(b.right));
              if (off.length >= 5) break;
            }
          }
          var hdr = d.querySelector('header');
          var nav = hdr && hdr.querySelector('nav');
          var logo = hdr && hdr.querySelector('.logo, .wm');
          var hdrInfo = null;
          if (nav && logo) {
            var nb = nav.getBoundingClientRect(), lb = logo.getBoundingClientRect();
            var sameRow = Math.abs(nb.top - lb.top) < 24;
            hdrInfo = { row: sameRow ? 'one' : 'stacked', gap: sameRow ? Math.round(lb.left - nb.right) : null, navRight: Math.round(nb.right) };
          }
          resolve({ url: url, w: w, off: off, hdr: hdrInfo });
        } catch (e) { resolve({ url: url, w: w, err: String(e).slice(0, 120) }); }
        f.parentNode && f.parentNode.removeChild(f);
      }, 900);
    };
    document.body.appendChild(f);
  });
}

(async function () {
  var out = [];
  for (var p = 0; p < PAGES.length; p++) for (var i = 0; i < WIDTHS.length; i++) out.push(await measure(PAGES[p], WIDTHS[i]));
  document.getElementById('out').textContent = JSON.stringify(out);
  window.__DONE__ = out;
})();
</script></body></html>
